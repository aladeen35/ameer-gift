name: Firebase setup (rules, anonymous sign-in, live visitors)

# Sets up the Firebase project from GitHub, without the console. The project is the one the key belongs to.
#  - creates the web app if there is none and prints its public config (copied into src/config.js)
#  - enables the needed Google APIs, creates Firestore and the Realtime Database when missing
#  - publishes firestore.rules and database.rules.json
#  - enables email/password and anonymous sign-in and authorizes the site domain
# Needs one repository secret: FIREBASE_SERVICE_ACCOUNT (Firebase > Project settings > Service accounts > Generate new private key).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["firestore.rules", "database.rules.json", ".github/workflows/firebase-setup.yml"]

permissions:
  contents: read

env:
  REGION: europe-west1
  SITE_DOMAIN: aladeen35.github.io

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the project from the key
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: |
          if [ -z "$SA" ]; then echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret first (see docs/OWNER-STEPS-AR.md)"; exit 1; fi
          P=$(echo "$SA" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).project_id)}catch(e){console.log("")}})')
          [ -n "$P" ] || { echo "::error::The secret is not a valid service account JSON"; exit 1; }
          echo "PROJECT=$P" >> "$GITHUB_ENV"; echo "RTDB_INSTANCE=$P-default-rtdb" >> "$GITHUB_ENV"
          echo "Project: $P"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Enable the Google APIs the site uses
        id: apis
        continue-on-error: true
        run: gcloud services enable firestore.googleapis.com identitytoolkit.googleapis.com firebasedatabase.googleapis.com firebaserules.googleapis.com firebase.googleapis.com --project "$PROJECT"

      - name: Web app and its public config
        id: webapp
        continue-on-error: true
        run: |
          ID=$(npx firebase apps:list WEB --project "$PROJECT" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).result||[];console.log(r[0]?.appId||"")})')
          if [ -z "$ID" ]; then
            ID=$(npx firebase apps:create WEB "Ameer Gift Web" --project "$PROJECT" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{console.log(JSON.parse(s).result?.appId||"")})')
          fi
          npx firebase apps:sdkconfig WEB "$ID" --project "$PROJECT" --json > webconfig.json
          node -e 'const c=require("./webconfig.json").result.sdkConfig;console.log("WEBCONFIG="+JSON.stringify(c))'

      - name: Create Firestore (first time only)
        id: firestore
        continue-on-error: true
        run: |
          if gcloud firestore databases describe --database="(default)" --project "$PROJECT" >/dev/null 2>&1; then echo "Firestore already exists"
          else gcloud firestore databases create --database="(default)" --location="$REGION" --type=firestore-native --project "$PROJECT"; fi

      - name: Publish Firestore rules
        id: fsrules
        continue-on-error: true
        run: npx firebase deploy --only firestore:rules --project "$PROJECT" --non-interactive

      - name: Create the Realtime Database (first time only)
        id: rtdb
        continue-on-error: true
        run: |
          if npx firebase database:instances:list --project "$PROJECT" 2>/dev/null | grep -q "$RTDB_INSTANCE"; then echo "Realtime Database already exists"
          else npx firebase database:instances:create "$RTDB_INSTANCE" --location "$REGION" --project "$PROJECT" --non-interactive; fi

      - name: Publish Realtime Database rules
        id: dbrules
        continue-on-error: true
        run: npx firebase deploy --only database --project "$PROJECT" --non-interactive

      - name: Enable email and anonymous sign-in, authorize the site domain
        id: auth
        continue-on-error: true
        run: |
          TOKEN=$(gcloud auth print-access-token)
          API="https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/config"
          CUR=$(curl -sS -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $PROJECT" "$API")
          echo "$CUR" | grep -q '"name"' || { echo "$CUR"; exit 1; }
          DOMAINS=$(echo "$CUR" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(s);const d=new Set(c.authorizedDomains||[]);d.add(process.env.SITE_DOMAIN);console.log(JSON.stringify([...d]))})')
          BODY=$(node -e 'console.log(JSON.stringify({signIn:{anonymous:{enabled:true},email:{enabled:true,passwordRequired:true}},authorizedDomains:JSON.parse(process.argv[1])}))' "$DOMAINS")
          OUT=$(curl -sS -X PATCH -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $PROJECT" -H "Content-Type: application/json" \
            "$API?updateMask=signIn.anonymous.enabled,signIn.email.enabled,signIn.email.passwordRequired,authorizedDomains" -d "$BODY")
          echo "$OUT" | grep -q '"name"' || { echo "$OUT"; exit 1; }
          echo "sign-in updated, domains: $DOMAINS"

      - name: Summary
        if: always()
        run: |
          r() { case "$1" in success) echo "✅";; skipped) echo "—";; *) echo "❌";; esac; }
          {
            echo "### نتيجة تفعيل Firebase للمشروع \`$PROJECT\`"
            echo "| الخطوة | النتيجة |"
            echo "|---|---|"
            echo "| تفعيل خدمات Google | $(r ${{ steps.apis.outcome }}) |"
            echo "| تطبيق الويب وإعداداته | $(r ${{ steps.webapp.outcome }}) |"
            echo "| إنشاء Firestore | $(r ${{ steps.firestore.outcome }}) |"
            echo "| قواعد Firestore | $(r ${{ steps.fsrules.outcome }}) |"
            echo "| إنشاء قاعدة البيانات اللحظية | $(r ${{ steps.rtdb.outcome }}) |"
            echo "| قواعد قاعدة البيانات اللحظية | $(r ${{ steps.dbrules.outcome }}) |"
            echo "| الدخول بالبريد والدخول المجهول والنطاق | $(r ${{ steps.auth.outcome }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          [ "${{ steps.fsrules.outcome }}" = success ] && [ "${{ steps.auth.outcome }}" = success ]

name: Android app (APK + AAB)

# Builds the Android app from the live PWA with Bubblewrap (Trusted Web Activity).
# Run it from the phone: GitHub app -> Actions -> "Android app (APK + AAB)" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown in the store (e.g. 1.0.1)"
        required: false
        default: "1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli@1.27.0
      - name: Point Bubblewrap at the runner's JDK and Android SDK
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          # Bubblewrap looks for $ANDROID_HOME/tools/bin/sdkmanager (older SDK layout)
          sudo ln -sfn "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          BT=$(node -p "require('$(npm root -g)/@bubblewrap/cli/node_modules/@bubblewrap/core/dist/lib/androidSdk/AndroidSdkTools.js').BUILD_TOOLS_VERSION" 2>/dev/null || node -p "require('$(npm root -g)/@bubblewrap/core/dist/lib/androidSdk/AndroidSdkTools.js').BUILD_TOOLS_VERSION")
          echo "build-tools $BT"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BT" > /dev/null
      - name: Signing key (from secrets, or a new one for the first build)
        id: key
        run: |
          cd android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android.keystore
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            PASS="${KEYSTORE_PASSWORD:-$(openssl rand -hex 16)}"
            echo "::add-mask::$PASS"
            keytool -genkeypair -v -keystore android.keystore -alias ameergift -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Ameer Gift, O=Ameer Gift, C=SA"
            echo "$PASS" > keystore-password.txt
            base64 -w0 android.keystore > android.keystore.base64.txt
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate the Android project
        run: |
          cd android
          VC=$(( 100 + ${{ github.run_number }} ))
          VN="${{ github.event.inputs.version_name || github.ref_name }}"; VN="${VN#v}"; echo "$VN" | grep -Eq '^[0-9]+(\.[0-9]+)*$' || VN="1.0.0"
          # icons come from the repo (served locally), so the build works even before the site is published
          (cd ../public && python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          node -e "const f='twa-manifest.json';const m=require('./'+f);m.appVersionCode=$VC;m.appVersionName='$VN';m.iconUrl='http://127.0.0.1:8765/icon-512.png';m.maskableIconUrl='http://127.0.0.1:8765/icon-maskable-512.png';m.webManifestUrl='http://127.0.0.1:8765/manifest.json';require('fs').writeFileSync(f,JSON.stringify(m,null,2))"
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
      - name: Build signed APK and AAB
        run: |
          cd android
          BUBBLEWRAP_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" BUBBLEWRAP_KEY_PASSWORD="$KEYSTORE_PASSWORD" bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json
      - name: Digital Asset Links file (removes the browser bar)
        run: |
          cd android
          FP=$(keytool -list -v -keystore android.keystore -alias ameergift -storepass "$KEYSTORE_PASSWORD" | grep -m1 'SHA256:' | sed 's/.*SHA256: //')
          echo "SHA-256 fingerprint: $FP"
          printf '[{\n  "relation": ["delegate_permission/common.handle_all_urls"],\n  "target": { "namespace": "android_app", "package_name": "com.ameergift.app", "sha256_cert_fingerprints": ["%s"] }\n}]\n' "$FP" > assetlinks.json
          cat assetlinks.json
          echo "### Android build" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`$FP\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: ameer-gift-android
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
            android/assetlinks.json
      - name: Upload the NEW signing key (download once, keep it safe, then save it as secrets)
        if: steps.key.outputs.new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KEEP-THIS-SAFE-android-signing-key
          path: |
            android/android.keystore
            android/android.keystore.base64.txt
            android/keystore-password.txt
          retention-days: 7

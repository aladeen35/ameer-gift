<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">
<title>لوحة الإدارة — هدايا أمير</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#13294B">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink);border-color:transparent}
.tabs .badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;margin-inline-start:6px;padding:0 5px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.stat.hl{background:var(--gold-soft);border-color:transparent}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:10px}
.bars i{flex:1;background:var(--gold-2);border-radius:4px 4px 0 0;min-height:2px}
.barlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.ocard{display:grid;gap:10px}
.ocard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rc{width:84px;height:84px;object-fit:cover;border-radius:10px;cursor:zoom-in;border:1px solid var(--line)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.pin{font-family:var(--font-display);font-size:26px;letter-spacing:.3em;direction:ltr;font-weight:600}
.pkg{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 label.f,.row2 label.f{margin-bottom:0}
.lst{display:grid;gap:10px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.center{text-align:center;padding:40px 0}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <span class="logo-chip"><img class="logo" src="logo-full.png" alt="هدايا أمير"></span>
  <b id="barTitle" style="font-family:var(--font-display);font-size:17px"></b>
  <span class="grow"></span>
  <button class="iconbtn" id="langBtn">EN</button>
  <button class="iconbtn hidden" id="outBtn"></button>
</div></header>

<main class="wrap" style="padding-bottom:60px">
  <div id="boot" class="center"><span class="spinner"></span></div>

  <section id="vLogin" class="hidden" style="max-width:420px;margin:30px auto">
    <div class="card stack">
      <h1 style="font-size:22px" data-t="loginH"></h1>
      <button class="btn ghost block" id="gBtn" data-t="google"></button>
      <form id="eForm" class="stack" style="gap:0" novalidate>
        <label class="f"><span data-t="email"></span><input class="in" id="eMail" type="email" dir="ltr" autocomplete="email"></label>
        <label class="f"><span data-t="password"></span><input class="in" id="ePass" type="password" dir="ltr" autocomplete="current-password"></label>
        <button class="btn block" data-t="signin"></button>
      </form>
    </div>
  </section>

  <section id="vGate" class="hidden" style="max-width:460px;margin:30px auto"><div class="card stack" id="gateBox"></div></section>

  <section id="vApp" class="hidden">
    <nav class="tabs" id="tabs" aria-label="sections"></nav>
    <div id="pane" style="margin-top:12px"></div>
  </section>
</main>
<dialog id="dlg"><div class="dbody" id="dlgBody"></div></dialog>

  tabs:{dash:"الأرقام",orders:"الطلبات",trials:"التجارب",pricing:"الأسعار",codes:"أكواد الخصم",feedback:"الآراء والشكاوى",team:"الفريق"},
  galleries:"كل المعارض",pending:"بانتظار التحقق",active:"مفعّلة",drafts:"مسودات",rejected:"مرفوضة",revenue:"المبيعات",thisMonth:"هذا الشهر",trials:"تجارب مرسلة",converted:"تجارب تحولت لشراء",complaints:"شكاوى مفتوحة",feedbacks:"كل الآراء",last14:"الطلبات المرسلة آخر ١٤ يومًا",companies:"معارض شركات",
  st:{draft:"مسودة",pending:"بانتظار التحقق",active:"مفعّل",rejected:"مرفوض"},all:"الكل",customer:"العميل",phone:"الجوال",pkg:"الباقة",visitors:"الزوار",rooms:"القاعات",photos:"الصور",price:"المبلغ",code:"كود الخصم",opens:"الفتح",now:"فور التفعيل",receipt:"الإشعار",noReceipt:"لا يوجد إشعار",

  fb:{feedback:"رأي",suggestion:"اقتراح",complaint:"شكوى"},resolve:"تم الحل",reopen:"إعادة فتح",resolved:"محلولة",anon:"بدون اسم",onlyComplaints:"الشكاوى فقط",
  members:"أعضاء الفريق",requests:"طلبات الانضمام",role:{admin:"مدير",staff:"موظف",marketer:"مسوق"},approveAs:"قبول كـ",remove:"إزالة",you:"(أنت)",noPerm:"لا تملك صلاحية لهذه العملية",err:"حدث خطأ"},

  galleries:"All museums",pending:"Awaiting check",active:"Active",drafts:"Drafts",rejected:"Rejected",revenue:"Sales",thisMonth:"This month",trials:"Trials sent",converted:"Trials that bought",complaints:"Open complaints",feedbacks:"All feedback",last14:"Orders sent in the last 14 days",companies:"Company museums",

const t = k => T[lang][k];
let user = null, role = "", tab = "dash", cache = {};

function applyLang() { document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $$("[data-t]").forEach(e => { const v = t(e.dataset.t); if (typeof v === "string") e.textContent = v; });
  $("#langBtn").textContent = lang === "ar" ? "EN" : "عربي"; $("#outBtn").textContent = t("out"); $("#barTitle").textContent = t("bar"); if (role) { renderTabs(); render(); } }
$("#langBtn").onclick = () => { lang = lang === "ar" ? "en" : "ar"; localStorage.setItem("ag-lang", lang); applyLang(); };
$("#gBtn").onclick = async () => { try { await googleSignIn(); } catch (e) { toast(authError(e, lang), "bad"); } };
$("#eForm").onsubmit = async ev => { ev.preventDefault(); try { await au.signInWithEmailAndPassword(auth, $("#eMail").value.trim(), $("#ePass").value); } catch (e) { toast(authError(e, lang), "bad"); } };
$("#outBtn").onclick = () => au.signOut(auth);
function view(id) { ["boot", "vLogin", "vGate", "vApp"].forEach(v => $("#" + v).classList.toggle("hidden", v !== id)); }

au.onAuthStateChanged(auth, async u => {
  user = u; role = ""; $("#outBtn").classList.toggle("hidden", !u);
  if (!u) return view("vLogin");
  view("boot");
  try { const r = await fs.getDoc(fs.doc(db, "roles", u.uid)); if (r.exists()) role = r.data().role; } catch (e) {}
  if (role) { tab = role === "admin" ? "dash" : "trials"; view("vApp"); renderTabs(); render(); return; }
  let booted = true; try { booted = (await fs.getDoc(fs.doc(db, "config", "bootstrap"))).exists(); } catch (e) {}
  const box = $("#gateBox"); view("vGate");
  if (!booted) {
    box.replaceChildren(el("h2", { style: "font-size:21px", text: t("bootH") }), el("p", { class: "muted", style: "margin:0", text: t("bootP") }),
      el("button", { class: "btn gold", text: t("bootBtn"), onclick: async () => {

          b.set(fs.doc(db, "config", "bootstrap"), { by: u.uid, at: fs.serverTimestamp() }); await b.commit(); location.reload(); }
        catch (e) { toast(t("noPerm") + " " + (e.code || ""), "bad"); } } }));
  } else {
    box.replaceChildren(el("h2", { style: "font-size:21px", text: t("reqH") }), el("p", { class: "muted", style: "margin:0", text: t("reqP") }),
      el("button", { class: "btn", text: t("reqBtn"), onclick: async () => {
        try { await fs.setDoc(fs.doc(db, "staffRequests", u.uid), { name: u.displayName || "", email: u.email || "", at: fs.serverTimestamp() }); toast(t("reqSent")); } catch (e) { toast(t("err"), "bad"); } } }));
  }

/* ---------- tabs ---------- */
function allowedTabs() { return role === "admin" ? ["dash", "orders", "trials", "pricing", "codes", "feedback", "team"] : ["trials"]; }
function renderTabs() { $("#tabs").replaceChildren(...allowedTabs().map(k => { const b = el("button", { "aria-pressed": String(tab === k), onclick: () => { tab = k; renderTabs(); render(); } }, t("tabs")[k]);
  if (k === "orders" && cache.pendingCount) b.append(el("span", { class: "badge", text: fmtNum(cache.pendingCount, lang) })); return b; })); }
async function render() { const p = $("#pane"); p.replaceChildren(el("div", { class: "center" }, el("span", { class: "spinner" })));
  try { await ({ dash, orders, trials, pricing: pricingTab, codes, feedback, team })[tab](p); } catch (e) { console.error(e); p.replaceChildren(el("p", { class: "muted", text: (e.code === "permission-denied" ? t("noPerm") : t("err")) + " " + (e.code || "") })); } }
async function getAll(path) { const s = await fs.getDocs(fs.collection(db, path)); return s.docs.map(d => ({ id: d.id, ...d.data() })); }
const ms = x => x?.toMillis?.() || 0;
function fmtDate(x, withTime = true) { const d = x?.toDate ? x.toDate() : (x instanceof Date ? x : null); if (!d) return "—";
  return new Intl.DateTimeFormat(lang === "ar" ? "ar-EG" : "en-GB", withTime ? { dateStyle: "medium", timeStyle: "short" } : { dateStyle: "medium" }).format(d); }
async function copy(s) { try { await navigator.clipboard.writeText(s); toast(t("copied")); } catch (e) { prompt("", s); } }
const stat = (n, l, hl) => el("div", { class: "stat" + (hl ? " hl" : "") }, el("b", { text: n }), el("span", { text: l }));
const sec = (title, ...kids) => el("div", { class: "card stack", style: "margin-bottom:14px" }, el("h2", { style: "font-size:18px", text: title }), ...kids);

/* ---------- dashboard ---------- */
async function dash(p) {
  const [gs, fb, tr] = await Promise.all([getAll("galleries"), getAll("feedback"), getAll("trials").catch(() => [])]);
  const by = s => gs.filter(g => g.status === s); cache.pendingCount = by("pending").length; renderTabs();
  const act = by("active"); const rev = {}, revM = {}; const m0 = new Date(); m0.setDate(1); m0.setHours(0, 0, 0, 0);
  for (const g of act) { rev[g.currency] = (rev[g.currency] || 0) + (g.price || 0); if (ms(g.activatedAt) >= m0.getTime()) revM[g.currency] = (revM[g.currency] || 0) + (g.price || 0); }
  const fmtRev = r => Object.keys(r).length ? Object.entries(r).map(([c, v]) => money(v, c, lang)).join(" · ") : "—";
  const phones = new Set(act.map(g => g.contact?.phone).filter(Boolean)); const conv = tr.filter(x => phones.has(x.id)).length;
  const days = Array.from({ length: 14 }, (_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 13 + i); return d.getTime(); });
  const counts = days.map(d => gs.filter(g => { const s = ms(g.submittedAt); return s >= d && s < d + 864e5; }).length); const mx = Math.max(1, ...counts);
  p.replaceChildren(
    el("div", { class: "stats" }, stat(fmtNum(cache.pendingCount, lang), t("pending"), true), stat(fmtNum(act.length, lang), t("active")), stat(fmtNum(gs.length, lang), t("galleries")), stat(fmtNum(by("draft").length, lang), t("drafts")),
      stat(fmtNum(tr.length, lang), t("trials")), stat(fmtNum(conv, lang), t("converted")), stat(fmtNum(fb.filter(f => f.type === "complaint" && !f.resolved).length, lang), t("complaints"), true), stat(fmtNum(gs.filter(g => g.type === "company").length, lang), t("companies"))),
    el("div", { class: "card stack", style: "margin-top:14px" }, el("div", { class: "line" }, el("b", { text: t("revenue") }), el("span", { text: fmtRev(rev) })), el("div", { class: "line" }, el("span", { class: "muted", text: t("thisMonth") }), el("span", { text: fmtRev(revM) }))),
    el("div", { class: "card", style: "margin-top:14px" }, el("b", { text: t("last14") }), el("div", { class: "bars" }, ...counts.map(c => el("i", { style: `height:${c / mx * 100}%`, title: String(c) }))),
      el("div", { class: "barlbl" }, el("span", { text: fmtDate(new Date(days[0]), false) }), el("span", { text: fmtDate(new Date(days[13]), false) }))));
}

/* ---------- orders ---------- */
let oFilter = "pending";
async function orders(p) {
  const pr = await loadPricing(); const gs = (await getAll("galleries")).sort((a, b) => ms(b.submittedAt || b.createdAt) - ms(a.submittedAt || a.createdAt));
  cache.pendingCount = gs.filter(g => g.status === "pending").length; renderTabs();
  const segs = ["pending", "active", "rejected", "draft", "all"];
  const segEl = el("div", { class: "seg", style: "margin-bottom:12px;overflow-x:auto" }, ...segs.map(s => el("button", { "aria-pressed": String(oFilter === s), onclick: () => { oFilter = s; orders(p); } }, s === "all" ? t("all") : t("st")[s])));
  const list = gs.filter(g => oFilter === "all" || g.status === oFilter);
  const cards = await Promise.all(list.map(g => orderCard(g, pr, p)));
  p.replaceChildren(segEl, list.length ? el("div", { class: "lst" }, ...cards) : el("p", { class: "muted", text: t("none") }));
}
async function orderCard(g, pr, p) {
  const pk = pr.packages.find(x => x.id === g.packageId) || {}; const chip = { draft: "", pending: "warn", active: "ok", rejected: "bad" }[g.status];
  const ph = g.contact?.phone || "";
  const kv = el("dl", { class: "kv" }, ...[[t("customer"), [g.contact?.name, g.contact?.email].filter(Boolean).join(" · ") || "—"], [t("phone"), ph ? "+" + ph : "—"],
    [t("pkg"), (lang === "ar" ? pk.nameAr : pk.nameEn) || g.packageId], [t("visitors"), fmtNum(g.visitors, lang)], [t("rooms"), fmtNum(g.sideRoom ? 2 : 1, lang)], [t("photos"), fmtNum(g.photoCount || 0, lang)],
    [t("price"), money(g.price || 0, g.currency, lang)], [t("code"), g.discountCode || "—"], [t("opens"), g.openAt ? fmtDate(g.openAt) : t("now")]].flatMap(([k, v]) => [el("dt", { text: k }), el("dd", { text: v })]));
  const c = el("div", { class: "card ocard" }, el("div", { class: "top" }, el("div", {}, el("h3", { style: "font-size:18px", text: g.title }), el("p", { class: "small muted", style: "margin:0", text: `${g.sender} ← ${g.recipient}` })),
    el("span", { class: "chip " + chip, text: t("st")[g.status] })), kv);
  if (g.company?.logo) c.append(el("img", { src: g.company.logo, alt: g.company.name || "", style: "max-height:56px;max-width:180px;background:#fff;border-radius:8px;padding:4px" }));
  if (g.receipt) c.append(el("div", { class: "line" }, el("span", { class: "small muted", text: t("receipt") }), el("img", { class: "rc", src: g.receipt, alt: t("receipt"), onclick: () => showImg(g.receipt) })));
  else if (g.status === "pending") c.append(el("p", { class: "small", style: "margin:0;color:var(--bad)", text: t("noReceipt") }));
  if (g.rejectReason && g.status === "rejected") c.append(el("p", { class: "small", style: "margin:0;color:var(--bad)", text: g.rejectReason }));
  const acts = el("div", { class: "acts" });
  if (g.status === "pending") {
    acts.append(el("button", { class: "btn sm gold", text: t("activate"), onclick: async e => { e.target.disabled = true; e.target.textContent = t("activating");
      try { await activate(g); toast(t("activated")); orders(p); } catch (x) { console.error(x); toast(t("err") + " " + (x.code || x.message || ""), "bad"); e.target.disabled = false; e.target.textContent = t("activate"); } } }),
      el("button", { class: "btn sm danger", text: t("reject"), onclick: async () => { const r = prompt(t("rejectQ")); if (r == null) return;
        try { await fs.updateDoc(fs.doc(db, "galleries", g.id), { status: "rejected", rejectReason: r.slice(0, 200), reviewedAt: fs.serverTimestamp() }); orders(p); } catch (x) { toast(t("err"), "bad"); } } }));
  }
  if (g.status === "active") {
    try { const a = await fs.getDoc(fs.doc(db, "galleries", g.id, "private", "access")); if (a.exists()) { const { pin } = a.data(); const url = museumUrl(g.id);

// Payment confirmed: create the private museum copy, the public teaser and the access code
async function activate(g) {
  const pin = randomPin(), key = await vaultKey(g.id, pin);
  const openAt = g.openAt || fs.Timestamp.now();
  const ph = await fs.getDocs(fs.collection(db, "galleries", g.id, "photos"));
  await fs.setDoc(fs.doc(db, "vaults", key), { owner: g.owner, gid: g.id, status: "active", demo: false, title: g.title, recipient: g.recipient, sender: g.sender, dedication: g.dedication || "",
    company: g.company || { name: "", logo: "" }, template: g.template || "classic", music: g.music || "", visitors: g.visitors || 4, sideRoom: !!g.sideRoom, openAt, photoCount: ph.size,
    expiresAt: fs.Timestamp.fromMillis(openAt.toMillis() + (g.months || 12) * 30 * 864e5), createdAt: fs.serverTimestamp() });
  for (const d of ph.docs) await fs.setDoc(fs.doc(db, "vaults", key, "photos", d.id), d.data());
  const b = fs.writeBatch(db);
  b.set(fs.doc(db, "teasers", g.id), { status: "active", title: g.title, recipient: g.recipient, sender: g.sender, openAt, logo: g.company?.logo || "", owner: g.owner });
  b.set(fs.doc(db, "galleries", g.id, "private", "access"), { pin, key, at: fs.serverTimestamp() });
  b.update(fs.doc(db, "galleries", g.id), { status: "active", activatedAt: fs.serverTimestamp(), activatedBy: user.uid, photosMoved: true });
  if (g.discountCode) b.update(fs.doc(db, "discounts", g.discountCode), { used: fs.increment(1) });
  await b.commit();
  for (const d of ph.docs) await fs.deleteDoc(d.ref);
}
